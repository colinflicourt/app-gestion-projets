<!doctype html>

<meta charset="utf-8">
<title>Icône de Jarvis Jr. (source)</title>
<!--
  Source de l'icône « Jr. », piste C « La touche GO », choisie par Colin le 2026-10-07 (VISUELS.md, § 1).
  Dessin original de Claude pour Jarvis Jr. Rendu en PNG par outils/visuels/rendre.py.
  Même dessin que la planche « Icône » de la maquette, à l'échelle 1024 / 220.
-->
<style>
@font-face{font-family:'Archivo';src:url('../../assets-originaux/polices/Archivo-variable.ttf') format('truetype');font-weight:100 900;font-stretch:62% 125%}
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#121417}
.ic{position:relative;width:1024px;height:1024px;background:#121417}
.touche{position:absolute;inset:158px;border-radius:140px;background:#FFB020;box-shadow:inset 0 -46px 0 #B98222,inset 0 9px 0 rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center}
.txt{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:75%;font-size:428px;letter-spacing:-0.02em;line-height:1;color:#121417;transform:translateY(-23px)}
</style>
</head>
<body>
<div class="ic"><div class="touche"><span class="txt">Jr.</span></div></div>
</body>
